<!DOCTYPE html>
<html lang="zh-Hant">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0f172a;
            color: #1e293b;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .bg-fixed-image {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: url('https://raw.githubusercontent.com/shanezzz1031/img/refs/heads/main/worldcup-082.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: rgba(15, 23, 42, 0.85);
        }

        .main-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: #ffffff;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .option-btn {
            transition: all 0.2s ease;
            border: 2px solid #f1f5f9;
            background: #f8fafc;
            cursor: pointer;
            text-align: left;
            width: 100%;
            display: block;
        }
        .option-btn:active { transform: scale(0.98); }
        .option-btn.selected {
            border-color: #2563eb;
            background-color: #eff6ff;
            color: #1e40af;
        }

        .star-img-wrapper {
            width: 100%;
            aspect-ratio: 1/1;
            background-color: #f1f5f9;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }
        .star-img {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center top;
        }

        #save-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .lang-btn {
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            transition: all 0.2s;
        }
        .lang-btn.active { background: #2563eb; color: white; }
        .lang-btn.inactive { background: #f1f5f9; color: #94a3b8; }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>

        function changeLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.classList.add('inactive');
            });
            const activeBtnId = lang === 'zh-Hant' ? 'lang-hant' : lang === 'zh-Hans' ? 'lang-hans' : 'lang-en';
            document.getElementById(activeBtnId).classList.replace('inactive', 'active');

            const t = i18n[lang];
            document.getElementById('home-title').innerHTML = t.homeTitle;
            document.getElementById('home-desc').innerText = t.homeDesc;
            document.getElementById('home-start-btn').innerText = t.homeStart;
            document.getElementById('label-why').innerText = t.labelWhy;
            document.getElementById('label-traits').innerText = t.labelTraits;
            document.getElementById('label-pos').innerText = t.labelPos;
            document.getElementById('label-val').innerText = t.labelVal;
            document.getElementById('btn-save').innerText = t.btnSave;
            document.getElementById('btn-restart').innerText = t.btnRestart;
            document.getElementById('save-hint').innerHTML = t.saveHint;
            document.getElementById('btn-close-preview').innerText = t.btnClose;

            if(!document.getElementById('screen-quiz').classList.contains('hidden')) renderQuestion();
            if(!document.getElementById('screen-result').classList.contains('hidden')) updateResultDisplay();
        }

        function startQuiz() {
            currentIdx = 0;
            answers = new Array(20).fill(null);
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const qObj = questions[currentIdx];
            const t = i18n[currentLang];
            document.getElementById('quiz-q-text').innerText = qObj.q[currentLang];
            document.getElementById('quiz-progress-text').innerText = `${String(currentIdx + 1).padStart(2, '0')} / 20`;
            document.getElementById('quiz-progress-bar').style.width = `${((currentIdx + 1) / 20) * 100}%`;

            const container = document.getElementById('quiz-options');
            container.innerHTML = '';
            qObj.options[currentLang].forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = `option-btn p-4 rounded-xl font-bold text-sm ${answers[currentIdx] === i ? 'selected' : ''}`;
                btn.innerText = opt;
                btn.onclick = () => {
                    answers[currentIdx] = i;
                    if(currentIdx < 19) {
                        currentIdx++;
                        setTimeout(renderQuestion, 200);
                    } else {
                        showResult();
                    }
                };
                container.appendChild(btn);
            });

            document.getElementById('btn-back').style.visibility = currentIdx === 0 ? 'hidden' : 'visible';
            document.getElementById('btn-back').innerText = t.back;
        }

        function goBack() {
            if (currentIdx > 0) {
                currentIdx--;
                renderQuestion();
            }
        }

        let mbtiResult = "";
        function showResult() {
            let counts = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
            answers.forEach((ansIdx, qIdx) => {
                const trait = questions[qIdx].weight[ansIdx];
                counts[trait]++;
            });

            mbtiResult = (counts.E >= counts.I ? 'E' : 'I') +
                         (counts.S >= counts.N ? 'S' : 'N') +
                         (counts.T >= counts.F ? 'T' : 'F') +
                         (counts.J >= counts.P ? 'J' : 'P');

            updateResultDisplay();
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function updateResultDisplay() {
            if(!mbtiResult) return;
            const data = starsData[mbtiResult] || starsData["ISFJ"];
            document.getElementById('res-mbti').innerText = mbtiResult;
            document.getElementById('res-title').innerText = data.name[currentLang];
            document.getElementById('res-role').innerText = data.role[currentLang];
            document.getElementById('res-why').innerText = data.why[currentLang];
            document.getElementById('res-traits').innerText = data.traits[currentLang];
            document.getElementById('res-pos').innerText = data.pos[currentLang];
            document.getElementById('res-val').innerText = data.val[currentLang];
            document.getElementById('res-advice').innerText = data.advice[currentLang];
            document.getElementById('res-img').style.backgroundImage = `url('https://raw.githubusercontent.com/shanezzz1031/img/refs/heads/main/png8/${data.img}')`;
        }

            btn.innerText = i18n[currentLang].generating;
            btn.disabled = true;

            html2canvas(area, { useCORS: true, scale: 2 }).then(canvas => {
                document.getElementById('preview-img').src = canvas.toDataURL('image/png');
                document.getElementById('save-overlay').style.display = 'flex';
                btn.innerText = originalText;
                btn.disabled = false;
            });
        }

        function closePreview() { document.getElementById('save-overlay').style.display = 'none'; }
        function resetQuiz() {
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-home').classList.remove('hidden');
        }

        // 初始化
        changeLang('zh-Hant');
    </script>
</body>
</html>
